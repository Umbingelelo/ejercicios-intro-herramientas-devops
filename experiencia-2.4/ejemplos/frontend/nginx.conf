# ============================================================
# nginx.conf - Servir Angular como SPA
# Experiencia 4
# ============================================================

server {
  listen       8080;
  server_name  _;

  root   /usr/share/nginx/html;
  index  index.html;

  # Compresion (mejora tiempos de carga del bundle JS).
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 1024;

  # SPA routing: si la URL no matchea un archivo,
  # devolver index.html para que Angular maneje la ruta.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache largo para assets con hash en el nombre.
  location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Sin cache para index.html: siempre se descarga la version nueva.
  location = /index.html {
    add_header Cache-Control "no-store";
  }
}
