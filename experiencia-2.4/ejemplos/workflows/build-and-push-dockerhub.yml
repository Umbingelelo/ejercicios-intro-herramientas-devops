# ============================================================
# .github/workflows/build-and-push-dockerhub.yml
# Experiencia 4 - Pipeline CI: build + push a Docker Hub
#
# Que hace:
#   1. Se dispara con push a la rama `deploy` (o manualmente).
#   2. Hace build de la imagen Docker del repo.
#   3. La etiqueta con tres tags: `vN.N.N`, `latest` y el SHA del commit.
#   4. La publica en Docker Hub.
#
# Secrets requeridos en el repositorio (Settings -> Secrets and variables -> Actions):
#   - DOCKERHUB_USERNAME : tu usuario de Docker Hub
#   - DOCKERHUB_TOKEN    : un Access Token (NO la contrasena), con permisos de Write
#
# Variables de repo o "vars" (no son secretos):
#   - IMAGE_NAME         : por ejemplo `tareas-backend` (sin el prefijo de usuario)
#
# Esta plantilla NO despliega a EC2: ese paso se agrega en la Experiencia 5.
# ============================================================

name: CI - Build and push to Docker Hub

on:
  push:
    branches: [ "deploy" ]      # solo se publica al hacer push a `deploy`
  workflow_dispatch:             # permite lanzarlo manualmente desde la UI

env:
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'tareas-backend' }}
  IMAGE_VERSION: "v1.0.0"        # cambiar a v1.0.1, v1.1.0, etc. en cada release

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read              # principio de minimo privilegio

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
        # Buildx permite caches compartidos y builds multi-plataforma.

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push (Docker Hub)
        uses: docker/build-push-action@v6
        with:
          context: .                      # raiz del repo
          file: ./Dockerfile              # Dockerfile multi-stage
          push: true                      # subir despues de construir
          platforms: linux/amd64          # mismo target que un EC2 t2.micro
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          echo "### Imagen publicada" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
